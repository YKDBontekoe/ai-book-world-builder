name: Reply to CodeRabbit Comments

on:
  pull_request_review_comment:
    types: [created]

jobs:
  reply-to-comment:
    if: github.actor == 'coderabbitai[bot]' && !github.event.comment.in_reply_to_id
    runs-on: ubuntu-latest
    steps:
      - name: Reply to Comment
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Processing PR Review Comment ID: $COMMENT_ID"

          # Reply to the specific review comment thread
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$REPO/pulls/$PR_NUMBER/comments/$COMMENT_ID/replies" \
            -f body='Jules check this out'
