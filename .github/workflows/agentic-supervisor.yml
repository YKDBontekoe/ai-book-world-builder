name: Agentic Supervisor

# Centralized orchestration for AI agents (Jules & CodeRabbit) & Workflow Automation
#
# Capabilities:
# 1. SUPERVISOR: Detects context (Issue vs PR) and routes instructions
# 2. JULES-API: Invokes Jules API for new contexts (human PRs, first-time Renovate)
# 3. JULES-MENTION: Posts @jules comments for existing contexts (Jules PRs, Renovate after first)
# 4. TRIAGE: Auto-labels new issues
# 5. MAINTENANCE: Auto-updates branches

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  checks: read
  statuses: read

env:
  CODERABBIT_USERS: coderabbitai[bot],coderabbitai
  CODECOV_USERS: codecov[bot],codecov
  SUPERVISOR_BOT_USERS: google-labs-jules,jules,renovate[bot],coderabbitai[bot],coderabbitai,codecov[bot],codecov,github-actions[bot]

jobs:
  # ==========================================================================
  # 1. SUPERVISOR: Analyze Context & Determine Intent
  # ==========================================================================
  supervisor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      is_pr: ${{ steps.analyze.outputs.is_pr }}
      number: ${{ steps.analyze.outputs.number }}
      branch: ${{ steps.analyze.outputs.branch }}
      author: ${{ steps.analyze.outputs.author }}
      labels: ${{ steps.analyze.outputs.labels }}
      invocation_method: ${{ steps.analyze.outputs.invocation_method }}
      jules_prompt: ${{ steps.analyze.outputs.jules_prompt }}
      batched_comments: ${{ steps.analyze.outputs.batched_comments }}
      should_trigger_coderabbit: ${{ steps.analyze.outputs.should_trigger_coderabbit }}
      assignee_mention: ${{ steps.analyze.outputs.assignee_mention }}

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 1

      - name: Analyze Event Context
        id: analyze
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT || github.token }}
        run: node .github/scripts/agentic-supervisor.js

  # ==========================================================================
  # 2a. JULES API INVOKE: For humans and first-time Renovate PRs
  # ==========================================================================
  jules-api-invoke:
    needs: supervisor
    if: needs.supervisor.outputs.invocation_method == 'api'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Acknowledge (Emoji)
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT || github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api "/repos/${{ github.repository }}/issues/comments/$COMMENT_ID/reactions" -f content="eyes" --repo "${{ github.repository }}" 2>/dev/null || true

      - name: Post status - Starting Jules session
        if: needs.supervisor.outputs.is_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT || github.token }}
          PR_NUMBER: ${{ needs.supervisor.outputs.number }}
          AUTHOR: ${{ needs.supervisor.outputs.author }}
        run: |
          gh pr comment "$PR_NUMBER" --body "🤖 **Jules Session Starting**
          
          Creating a new Jules session to address the feedback. This may take a few minutes.
          
          **PR Author:** \`$AUTHOR\`
          **Method:** API Invoke (new session)" --repo "${{ github.repository }}"

      - name: Invoke Jules API
        uses: google-labs-code/jules-action@bff7875eaa123cac6742b7cfc51005b95ba4d566 # v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: ${{ needs.supervisor.outputs.branch }}
          prompt: ${{ needs.supervisor.outputs.jules_prompt }}

      - name: Add jules-invoked label (for Renovate PRs)
        if: needs.supervisor.outputs.author == 'renovate[bot]' && needs.supervisor.outputs.is_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT || github.token }}
          PR_NUMBER: ${{ needs.supervisor.outputs.number }}
        run: |
          gh pr edit "$PR_NUMBER" --add-label "jules-invoked" --repo "${{ github.repository }}" 2>/dev/null || true
          gh pr comment "$PR_NUMBER" --body "📝 Added \`jules-invoked\` label. Future feedback will use @jules mentions instead of new API sessions (cost optimization)." --repo "${{ github.repository }}"

  # ==========================================================================
  # 2b. JULES MENTION: For Jules PRs and subsequent Renovate feedback
  # ==========================================================================
  jules-mention:
    needs: supervisor
    if: needs.supervisor.outputs.invocation_method == 'mention'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post status - Using ${{ needs.supervisor.outputs.assignee_mention }}
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT || github.token }}
          PR_NUMBER: ${{ needs.supervisor.outputs.number }}
          AUTHOR: ${{ needs.supervisor.outputs.author }}
          ASSIGNEE_MENTION: ${{ needs.supervisor.outputs.assignee_mention }}
        run: |
          # Use default if empty
          MENTION="${ASSIGNEE_MENTION:-@jules}"

          gh pr comment "$PR_NUMBER" --body "🔄 **Routing via Trigger**
          
          Using ${MENTION} (cost-optimized) instead of new API session.
          
          **PR Author:** \`$AUTHOR\`
          **Method:** GitHub Integration (${MENTION})" --repo "${{ github.repository }}"

      - name: Post ${{ needs.supervisor.outputs.assignee_mention }} with feedback
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT || github.token }}
          PR_NUMBER: ${{ needs.supervisor.outputs.number }}
          BATCHED_COMMENTS: ${{ needs.supervisor.outputs.batched_comments }}
          AUTHOR: ${{ needs.supervisor.outputs.author }}
          ASSIGNEE_MENTION: ${{ needs.supervisor.outputs.assignee_mention }}
        run: |
          # Use default if empty
          MENTION="${ASSIGNEE_MENTION:-@jules}"

          if [[ -n "$BATCHED_COMMENTS" ]]; then
            echo "${MENTION} Please address the following feedback:" > /tmp/comment.md
            echo "" >> /tmp/comment.md
            echo "$BATCHED_COMMENTS" >> /tmp/comment.md
            echo "" >> /tmp/comment.md
            echo "Instructions:" >> /tmp/comment.md
            echo "1. Run \`pnpm lint && pnpm type-check && pnpm test:unit\`" >> /tmp/comment.md
            echo "2. Fix all issues identified above" >> /tmp/comment.md
            echo "3. Commit with message: \`fix: address review feedback\`" >> /tmp/comment.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md --repo "${{ github.repository }}"
          else
            gh pr comment "$PR_NUMBER" --body "${MENTION} Please review and address any pending feedback on this PR." --repo "${{ github.repository }}"
          fi


  # ==========================================================================
  # 3. CODERABBIT TRIGGER: For Bot PRs Only (after CI passes)
  # ==========================================================================
  coderabbit-trigger:
    needs: supervisor
    if: needs.supervisor.outputs.should_trigger_coderabbit == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Request CodeRabbit Review
        if: needs.supervisor.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT || github.token }}
          PR_NUMBER: ${{ needs.supervisor.outputs.number }}
          AUTHOR: ${{ needs.supervisor.outputs.author }}
        run: |
          gh pr comment "$PR_NUMBER" --body "🐰 **Requesting CodeRabbit Review**
          
          CI passed for bot PR (Author: \`$AUTHOR\`). Triggering full code review.
          
          @coderabbitai review" --repo "${{ github.repository }}"

  # ==========================================================================
  # 5. ONBOARDING: Good First Issue
  # ==========================================================================
  good-first-issue:
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'good first issue'
    runs-on: ubuntu-latest
    steps:
      - name: Post Help
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT || github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment $ISSUE --body "🌟 **Good First Issue!**
          1. Fork & Clone
          2. Branch: \`fix/issue-$ISSUE\`
          3. Mention \`@jules\` if stuck!" --repo "${{ github.repository }}"

  # ==========================================================================
  # 6. REVIEW: Request Human Review
  # ==========================================================================
  request-human-review:
    needs: supervisor
    if: |
      needs.supervisor.outputs.is_pr == 'true' &&
      github.event.action == 'labeled' &&
      (contains(github.event.label.name, 'security') || contains(github.event.label.name, 'breaking-change') || contains(github.event.label.name, 'size/xl'))
    runs-on: ubuntu-latest
    steps:
      - name: Request Review
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT || github.token }}
          PR: ${{ needs.supervisor.outputs.number }}
        run: gh pr comment "$PR" --body "⚠️ Human Review Required due to sensitive labels (security, breaking-change, or large change)." --repo "${{ github.repository }}"

  # ==========================================================================
  # 7. MAINTENANCE: Update Branch
  # ==========================================================================
  update-branch:
    needs: supervisor
    if: needs.supervisor.outputs.is_pr == 'true' && (github.event.action == 'synchronize' || github.event.action == 'opened')
    runs-on: ubuntu-latest
    steps:
      - name: Update if Behind
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT || github.token }}
          PR: ${{ needs.supervisor.outputs.number }}
        run: |
          STATUS=$(gh pr view "$PR" --json mergeStateStatus --jq '.mergeStateStatus' --repo "${{ github.repository }}" 2>/dev/null || echo "")
          if [[ "$STATUS" == "BEHIND" ]]; then
            gh pr update-branch "$PR" --rebase --repo "${{ github.repository }}" || true
          fi
