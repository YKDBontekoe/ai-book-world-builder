name: Agentic Supervisor

# Simplified supervisor with author-based routing:
# - Jules PRs: Use @jules mentions (free)
# - Bot/Human PRs: Use Jules API (full context)

on:
  workflow_run:
    workflows: ["CI", "E2E Nightly", "Security Audit"]
    types: [completed]

  pull_request_review:
    types: [submitted]

  issue_comment:
    types: [created]

  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: supervisor-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  supervisor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      action: ${{ steps.run.outputs.action }}
      pr_number: ${{ steps.run.outputs.pr_number }}
      branch: ${{ steps.run.outputs.branch }}
      prompt: ${{ steps.run.outputs.prompt }}
      author_type: ${{ steps.run.outputs.author_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: "20"

      - name: Install tsx
        run: npm install -g tsx

      - name: Run Supervisor
        id: run
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: tsx .github/scripts/supervisor.ts

  # Invoke Jules API for bot/human PRs
  invoke-jules:
    needs: supervisor
    if: needs.supervisor.outputs.action == 'invoke_jules_api'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Post status comment
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT }}
          PR_NUMBER: ${{ needs.supervisor.outputs.pr_number }}
          AUTHOR_TYPE: ${{ needs.supervisor.outputs.author_type }}
        run: |
          gh pr comment "$PR_NUMBER" --body "🤖 **Jules Session Starting**
          
          Creating a new Jules session to address the issues.
          
          **Author Type:** \`$AUTHOR_TYPE\`
          **Method:** API Invoke (full context)" --repo "${{ github.repository }}"

      - name: Invoke Jules API
        uses: google-labs-code/jules-action@bff7875eaa123cac6742b7cfc51005b95ba4d566 # v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: ${{ needs.supervisor.outputs.branch }}
          prompt: ${{ needs.supervisor.outputs.prompt }}
          include_last_commit: true
          include_commit_log: true
