name: CodeRabbit Review Trigger

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  pull-requests: write

jobs:
  trigger-review:
    runs-on: ubuntu-latest
    # Skip for Renovate PRs (they're auto-merge candidates)
    # Skip for draft PRs (CodeRabbit handles this via config)
    if: |
      github.actor != 'renovate[bot]' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    steps:
      - name: Determine review type
        id: review-type
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Get PR stats
          STATS=$(gh pr view $PR_NUMBER --json additions,deletions,changedFiles --jq '{add: .additions, del: .deletions, files: .changedFiles}')
          ADDITIONS=$(echo "$STATS" | jq '.add')
          DELETIONS=$(echo "$STATS" | jq '.del')
          FILES=$(echo "$STATS" | jq '.files')
          TOTAL=$((ADDITIONS + DELETIONS))
          
          echo "total_changes=$TOTAL" >> $GITHUB_OUTPUT
          echo "files_changed=$FILES" >> $GITHUB_OUTPUT
          
          # Determine if this needs full review
          if [ "$TOTAL" -gt 500 ] || [ "$FILES" -gt 20 ]; then
            echo "review_type=full" >> $GITHUB_OUTPUT
          else
            echo "review_type=incremental" >> $GITHUB_OUTPUT
          fi

      - name: Trigger CodeRabbit review
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT }}
        run: |
          if [ "${{ steps.review-type.outputs.review_type }}" == "full" ]; then
            echo "Triggering full review for large PR (${{ steps.review-type.outputs.total_changes }} lines, ${{ steps.review-type.outputs.files_changed }} files)"
            gh pr comment ${{ github.event.pull_request.number }} --body "@coderabbitai full review" --repo ${{ github.repository }}
          else
            echo "Triggering incremental review (${{ steps.review-type.outputs.total_changes }} lines, ${{ steps.review-type.outputs.files_changed }} files)"
            gh pr comment ${{ github.event.pull_request.number }} --body "@coderabbitai review" --repo ${{ github.repository }}
          fi

  # Auto-review for bot PRs (Renovate, Jules) with specific instructions
  trigger-bot-review:
    runs-on: ubuntu-latest
    if: |
      (github.actor == 'renovate[bot]' || github.actor == 'google-labs-jules') &&
      github.event.action == 'opened'
    steps:
      - name: Trigger focused review for bot PR
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT }}
        run: |
          if [ "${{ github.actor }}" == "renovate[bot]" ]; then
            # For Renovate: Focus on breaking changes and security
            gh pr comment ${{ github.event.pull_request.number }} --body "@coderabbitai review

            Focus on:
            1. Breaking changes in updated packages
            2. Security advisories
            3. Deprecation warnings
            Skip: Code style, minor improvements" --repo ${{ github.repository }}
          else
            # For Jules: Verify the AI's work
            gh pr comment ${{ github.event.pull_request.number }} --body "@coderabbitai full review

            This PR was created by Jules (AI agent). Please perform a thorough review:
            1. Verify the implementation matches the issue/task
            2. Check for any AI hallucinations or incorrect assumptions
            3. Ensure tests are adequate
            4. Flag any security concerns
            
            Start actionable comments with @jules" --repo ${{ github.repository }}
          fi
