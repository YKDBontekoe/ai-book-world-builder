name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/**'
      - 'next.config.*'
      - 'tsconfig.json'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to run CI for (optional)'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Set global memory limit for all jobs to prevent Heap errors
env:
  NODE_OPTIONS: "--max-old-space-size=6144"

jobs:
  # ============================================================================
  # SETUP: Calculate test shards dynamically
  # ============================================================================
  setup-tests:
    runs-on: ubuntu-latest
    outputs:
      shard-matrix: ${{ steps.set-matrix.outputs.matrix }}
      shard-total: ${{ steps.set-matrix.outputs.total }}
      test-count: ${{ steps.set-matrix.outputs.test_count }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - id: set-matrix
        run: |
          # Count unit test files
          TEST_COUNT=$(find tests/unit -type f \( -name "*.test.ts" -o -name "*.test.tsx" -o -name "*.spec.ts" -o -name "*.spec.tsx" \) 2>/dev/null | wc -l | tr -d ' ')
          
          if [ "$TEST_COUNT" -eq 0 ]; then
            # No tests found, use minimal config
            SHARD_TOTAL=1
          else
            # Calculate shards: ~50 tests per shard, minimum 2, maximum 6
            SHARD_TOTAL=$(( ($TEST_COUNT + 49) / 50 ))
            if [ "$SHARD_TOTAL" -lt 2 ]; then SHARD_TOTAL=2; fi
            if [ "$SHARD_TOTAL" -gt 6 ]; then SHARD_TOTAL=6; fi
          fi
          
          # Generate JSON array [1, 2, ..., SHARD_TOTAL]
          MATRIX=$(node -e "console.log(JSON.stringify(Array.from({length: $SHARD_TOTAL}, (_, i) => i + 1)))")
          
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "total=$SHARD_TOTAL" >> $GITHUB_OUTPUT
          echo "test_count=$TEST_COUNT" >> $GITHUB_OUTPUT
          echo "📊 Found $TEST_COUNT tests → $SHARD_TOTAL shards"

  # ============================================================================
  # LINT & TYPE CHECK: Static analysis
  # ============================================================================
  lint-and-typecheck:
    runs-on: ubuntu-latest
    outputs:
      lint-result: ${{ steps.lint.outcome }}
      typecheck-result: ${{ steps.typecheck.outcome }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: ./.github/actions/setup
      
      - name: Run linter
        id: lint
        run: pnpm lint
        continue-on-error: true
        
      - name: Run type check
        id: typecheck
        run: pnpm type-check
        continue-on-error: true
        
      - name: Save lint errors
        if: steps.lint.outcome == 'failure'
        run: |
          pnpm lint 2>&1 | head -100 > /tmp/lint-errors.txt || true
          
      - name: Upload lint errors artifact
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-errors
          path: /tmp/lint-errors.txt
          retention-days: 1
          
      - name: Fail if checks failed
        if: steps.lint.outcome == 'failure' || steps.typecheck.outcome == 'failure'
        run: |
          echo "❌ Static analysis failed"
          echo "Lint: ${{ steps.lint.outcome }}"
          echo "Type check: ${{ steps.typecheck.outcome }}"
          exit 1

  # ============================================================================
  # UNIT TESTS: Parallel sharded testing
  # ============================================================================
  unit-tests:
    needs: setup-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.setup-tests.outputs.shard-matrix) }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: ./.github/actions/setup
      
      - name: Run unit tests (shard ${{ matrix.shard }}/${{ needs.setup-tests.outputs.shard-total }})
        id: test
        run: |
          pnpm test:unit --shard=${{ matrix.shard }}/${{ needs.setup-tests.outputs.shard-total }} 2>&1 | tee /tmp/test-output.txt
        continue-on-error: true
        
      - name: Upload test output on failure
        if: steps.test.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-errors-shard-${{ matrix.shard }}
          path: /tmp/test-output.txt
          retention-days: 1
          
      - name: Fail if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

  # ============================================================================
  # BUILD: Production build verification
  # ============================================================================
  build:
    runs-on: ubuntu-latest
    outputs:
      build-result: ${{ steps.build.outcome }}
    env:
      GENERATE_SOURCEMAP: false
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: ./.github/actions/setup

      - name: Cache Next.js build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Build application
        id: build
        run: pnpm build 2>&1 | tee /tmp/build-output.txt
        continue-on-error: true
        
      - name: Upload build errors on failure
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-errors
          path: /tmp/build-output.txt
          retention-days: 1
          
      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

  # ============================================================================
  # DATABASE: Schema validation
  # ============================================================================
  db-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: ./.github/actions/setup
      - name: Validate database schema
        run: pnpm db:check

  # ============================================================================
  # CONFLICTS: Check merge compatibility
  # ============================================================================
  check-conflicts:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0
          
      - name: Check for merge conflicts
        run: |
          git fetch origin ${{ github.base_ref }}
          if git merge-tree --write-tree HEAD origin/${{ github.base_ref }} > /dev/null 2>&1; then
            echo "✅ No merge conflicts detected"
          else
            echo "❌ Merge conflict detected with ${{ github.base_ref }}"
            echo "Please rebase or merge the latest changes from ${{ github.base_ref }}"
            exit 1
          fi

  # ============================================================================
  # FINAL STATUS: Aggregate all job results
  # ============================================================================
  ci-status:
    runs-on: ubuntu-latest
    needs: [setup-tests, lint-and-typecheck, unit-tests, build, db-check, check-conflicts]
    if: always()
    outputs:
      success: ${{ steps.evaluate.outputs.success }}
      failed-jobs: ${{ steps.evaluate.outputs.failed_jobs }}
    steps:
      - name: Evaluate all results
        id: evaluate
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          FAILED_JOBS=""
          SUCCESS="true"
          
          for job in $(echo "$RESULTS" | jq -r 'keys[]'); do
            result=$(echo "$RESULTS" | jq -r ".[\"$job\"].result")
            echo "Job $job: $result"
            
            if [[ "$result" == "failure" ]]; then
              FAILED_JOBS="$FAILED_JOBS,$job"
              SUCCESS="false"
            elif [[ "$result" == "cancelled" ]]; then
              FAILED_JOBS="$FAILED_JOBS,$job(cancelled)"
              SUCCESS="false"
            fi
          done
          
          FAILED_JOBS=$(echo "$FAILED_JOBS" | sed 's/^,//')
          
          echo "success=$SUCCESS" >> $GITHUB_OUTPUT
          echo "failed_jobs=$FAILED_JOBS" >> $GITHUB_OUTPUT
          
          if [[ "$SUCCESS" == "true" ]]; then
            echo "✅ All CI checks passed!"
          else
            echo "❌ CI failed. Failed jobs: $FAILED_JOBS"
            exit 1
          fi

  # ============================================================================
  # NOTIFY: Post failure summary
  # ============================================================================
  notify-failure:
    runs-on: ubuntu-latest
    needs: [ci-status]
    if: always() && needs.ci-status.outputs.success == 'false' && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post failure summary to PR
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT }}
          FAILED_JOBS: ${{ needs.ci-status.outputs.failed-jobs }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          EXISTING=$(gh api "/repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            --jq "[.[] | select(.body | contains(\"$RUN_ID\"))] | length" 2>/dev/null || echo "0")
          
          if [[ "$EXISTING" -gt 0 ]]; then
            echo "Already posted comment for this run"
            exit 0
          fi
          
          gh pr comment "$PR_NUMBER" --body "🚨 CI Failed - Jobs: $FAILED_JOBS - [View Run]($RUN_URL)"