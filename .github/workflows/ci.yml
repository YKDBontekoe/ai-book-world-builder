name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/**'
      - 'next.config.*'
      - 'tsconfig.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Set global memory limit and Vercel IDs
env:
  NODE_OPTIONS: "--max-old-space-size=6144"
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # ============================================================================
  # PR CHECKS: Only run on pull requests
  # ============================================================================
  setup-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      shard-matrix: ${{ steps.set-matrix.outputs.matrix }}
      shard-total: ${{ steps.set-matrix.outputs.total }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - id: set-matrix
        run: |
          # Count unit test files
          TEST_COUNT=$(find tests/unit -type f \( -name "*.test.ts" -o -name "*.test.tsx" -o -name "*.spec.ts" -o -name "*.spec.tsx" \) | wc -l)
          
          # Calculate shards: ~50 tests per shard, minimum 2, maximum 6
          SHARD_TOTAL=$(( ($TEST_COUNT + 49) / 50 ))
          if [ "$SHARD_TOTAL" -lt 2 ]; then SHARD_TOTAL=2; fi
          if [ "$SHARD_TOTAL" -gt 6 ]; then SHARD_TOTAL=6; fi
          
          # Generate JSON array [1, 2, ..., SHARD_TOTAL]
          MATRIX=$(node -e "console.log(JSON.stringify(Array.from({length: $SHARD_TOTAL}, (_, i) => i + 1)))")
          
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "total=$SHARD_TOTAL" >> $GITHUB_OUTPUT
          echo "Found $TEST_COUNT tests. Dynamic shard count: $SHARD_TOTAL"

  lint-and-typecheck:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm type-check

  unit-tests:
    needs: setup-tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.setup-tests.outputs.shard-matrix) }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: ./.github/actions/setup
      - run: pnpm test:unit --coverage --shard=${{ matrix.shard }}/${{ needs.setup-tests.outputs.shard-total }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit-tests
          name: shard-${{ matrix.shard }}
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      GENERATE_SOURCEMAP: false
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: ./.github/actions/setup

      - name: Cache Next.js build
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - run: pnpm build

  db-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: ./.github/actions/setup
      - run: pnpm db:check

  check-conflicts:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0
      - name: Check for merge conflicts
        run: |
          git fetch origin ${{ github.base_ref }}
          git merge-tree --write-tree HEAD origin/${{ github.base_ref }} > /dev/null || (echo "❌ Merge conflict detected" && exit 1)
          echo "✅ No merge conflicts"

  ci-success:
    runs-on: ubuntu-latest
    needs: [setup-tests, lint-and-typecheck, unit-tests, build, db-check, check-conflicts]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Evaluate Results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "CI pipeline failed."
            exit 1
          fi
          echo "CI pipeline passed!"

  notify-failure:
    runs-on: ubuntu-latest
    needs: [setup-tests, lint-and-typecheck, unit-tests, build, db-check, check-conflicts]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0

      - name: Make Scripts Executable
        run: chmod +x .github/scripts/*.sh

      - name: Collect failure details
        id: failures
        env:
          RESULTS_JSON: ${{ toJson(needs) }}
        run: ./.github/scripts/analyze-failures.sh

      - name: Comment on PR about failures
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT }}
        run: |
          MESSAGE="🚨 **CI Pipeline Failed**

          The following checks failed on this PR:
          ${{ steps.failures.outputs.failed_jobs }}

          **Workflow Run:** ${{ steps.failures.outputs.workflow_url }}

          🤖 @Jules will automatically attempt to fix these issues."

          echo "$MESSAGE" > message.txt
          gh pr comment ${{ github.event.pull_request.number }} --body-file message.txt --repo ${{ github.repository }}
