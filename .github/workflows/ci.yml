name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  db-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:check

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - run: pnpm test:e2e
        env:
          AUTH_SECRET: dummy_secret_for_e2e_tests


  notify-failure:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, build, db-check, e2e-tests]
    if: |
      always() && 
      github.event_name == 'pull_request' && 
      github.actor == 'google-labs-jules' && 
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    permissions:
      pull-requests: write
    steps:
      - name: Notify @jules
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINT_RESULT: ${{ needs.lint-and-typecheck.result }}
          UNIT_TEST_RESULT: ${{ needs.unit-tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DB_RESULT: ${{ needs.db-check.result }}
          E2E_RESULT: ${{ needs.e2e-tests.result }}
        run: |
          failures=""
          if [[ "$LINT_RESULT" == "failure" || "$LINT_RESULT" == "cancelled" ]]; then failures="${failures}- 🛑 Lint & Typecheck\n"; fi
          if [[ "$UNIT_TEST_RESULT" == "failure" || "$UNIT_TEST_RESULT" == "cancelled" ]]; then failures="${failures}- 🛑 Unit Tests\n"; fi
          if [[ "$BUILD_RESULT" == "failure" || "$BUILD_RESULT" == "cancelled" ]]; then failures="${failures}- 🛑 Build\n"; fi
          if [[ "$DB_RESULT" == "failure" || "$DB_RESULT" == "cancelled" ]]; then failures="${failures}- 🛑 DB Check\n"; fi
          if [[ "$E2E_RESULT" == "failure" || "$E2E_RESULT" == "cancelled" ]]; then failures="${failures}- 🛑 E2E Tests\n"; fi
          
          echo -e "Hey @jules, the following checks failed on this PR:\n\n$failures\nPlease take a look! 🔍" > message.txt
          gh pr comment ${{ github.event.pull_request.number }} --body-file message.txt --repo ${{ github.repository }}




