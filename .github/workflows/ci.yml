name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/**'
      - 'next.config.*'
      - 'tsconfig.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Set global memory limit for all jobs to prevent Heap errors
env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm type-check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm test:unit

  build:
    runs-on: ubuntu-latest
    env:
      # Next.js specific memory saver
      GENERATE_SOURCEMAP: false 
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - run: pnpm build

  db-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm db:check

  check-conflicts:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check for merge conflicts
        run: |
          git fetch origin ${{ github.base_ref }}
          git merge-tree --write-tree HEAD origin/${{ github.base_ref }} > /dev/null || (echo "❌ Merge conflict detected" && exit 1)
          echo "✅ No merge conflicts"

  ci-success:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, build, db-check, check-conflicts]
    if: always()
    steps:
      - name: Evaluate Results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "CI pipeline failed."
            exit 1
          fi
          echo "CI pipeline passed!"

  notify-failure:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, build, db-check, check-conflicts]
    if: |
      always() && 
      github.event_name == 'pull_request' && 
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    permissions:
      pull-requests: write
    steps:
      - name: Notify @jules
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT }}
          RESULTS: ${{ toJson(needs) }}
        run: |
          MESSAGE="Jules, the following checks failed on this PR:"
          for job in $(echo $RESULTS | jq -r 'keys[]'); do
            result=$(echo $RESULTS | jq -r ".$job.result")
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              MESSAGE="$MESSAGE\n- 🛑 $job"
            fi
          done
          MESSAGE="$MESSAGE\n\n**Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nPlease take a look! 🔍"
          echo -e "$MESSAGE" > message.txt
          gh pr comment ${{ github.event.pull_request.number }} --body-file message.txt --repo ${{ github.repository }}