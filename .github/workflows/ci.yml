name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/**'
      - 'next.config.*'
      - 'tsconfig.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Set global memory limit for all jobs to prevent Heap errors
env:
  NODE_OPTIONS: "--max-old-space-size=6144"

jobs:
  setup-tests:
    runs-on: ubuntu-latest
    outputs:
      shard-matrix: ${{ steps.set-matrix.outputs.matrix }}
      shard-total: ${{ steps.set-matrix.outputs.total }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - id: set-matrix
        run: |
          # Count unit test files
          TEST_COUNT=$(find tests/unit -type f \( -name "*.test.ts" -o -name "*.test.tsx" -o -name "*.spec.ts" -o -name "*.spec.tsx" \) | wc -l)
          
          # Calculate shards: ~50 tests per shard, minimum 2, maximum 6
          SHARD_TOTAL=$(( ($TEST_COUNT + 49) / 50 ))
          if [ "$SHARD_TOTAL" -lt 2 ]; then SHARD_TOTAL=2; fi
          if [ "$SHARD_TOTAL" -gt 6 ]; then SHARD_TOTAL=6; fi
          
          # Generate JSON array [1, 2, ..., SHARD_TOTAL]
          MATRIX=$(node -e "console.log(JSON.stringify(Array.from({length: $SHARD_TOTAL}, (_, i) => i + 1)))")
          
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "total=$SHARD_TOTAL" >> $GITHUB_OUTPUT
          echo "Found $TEST_COUNT tests. Dynamic shard count: $SHARD_TOTAL"

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm type-check

  unit-tests:
    needs: setup-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.setup-tests.outputs.shard-matrix) }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: ./.github/actions/setup
      - run: pnpm test:unit --shard=${{ matrix.shard }}/${{ needs.setup-tests.outputs.shard-total }}

  build:
    runs-on: ubuntu-latest
    env:
      # Next.js specific memory saver
      GENERATE_SOURCEMAP: false
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: ./.github/actions/setup

      - name: Cache Next.js build
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - run: pnpm build

  db-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: ./.github/actions/setup
      - run: pnpm db:check

  check-conflicts:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0
      - name: Check for merge conflicts
        run: |
          git fetch origin ${{ github.base_ref }}
          git merge-tree --write-tree HEAD origin/${{ github.base_ref }} > /dev/null || (echo "❌ Merge conflict detected" && exit 1)
          echo "✅ No merge conflicts"

  ci-success:
    runs-on: ubuntu-latest
    needs: [setup-tests, lint-and-typecheck, unit-tests, build, db-check, check-conflicts]
    if: always()
    steps:
      - name: Evaluate Results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "CI pipeline failed."
            exit 1
          fi
          echo "CI pipeline passed!"

  notify-failure:
    runs-on: ubuntu-latest
    needs: [setup-tests, lint-and-typecheck, unit-tests, build, db-check, check-conflicts]
    if: |
      always() &&
      github.event_name == 'pull_request' && 
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0

      - name: Collect failure details
        id: failures
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          FAILED_JOBS=""
          for job in $(echo $RESULTS | jq -r 'keys[]'); do
            result=$(echo $RESULTS | jq -r ".$job.result")
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              FAILED_JOBS="$FAILED_JOBS\n- 🛑 $job ($result)"
            fi
          done
          
          echo "failed_jobs<<EOF" >> $GITHUB_OUTPUT
          echo -e "$FAILED_JOBS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "workflow_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT

      - name: Comment on PR about failures
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT }}
        run: |
          MESSAGE="🚨 **CI Pipeline Failed**

          The following checks failed on this PR:
          ${{ steps.failures.outputs.failed_jobs }}

          **Workflow Run:** ${{ steps.failures.outputs.workflow_url }}

          🤖 Jules is investigating and will attempt to fix these issues."

          echo "$MESSAGE" > message.txt
          gh pr comment ${{ github.event.pull_request.number }} --body-file message.txt --repo ${{ github.repository }}

      - name: Invoke Jules to fix CI failures
        uses: google-labs-code/jules-invoke@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: ${{ github.head_ref }}
          prompt: |
            The CI pipeline has failed for Pull Request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            ## Failed Checks
            ${{ steps.failures.outputs.failed_jobs }}

            ## Workflow Run
            ${{ steps.failures.outputs.workflow_url }}

            ## Your Task
            1. **Identify the root cause** of each failure:
               - For `lint-and-typecheck`: Run `pnpm lint` and `pnpm type-check` to see errors
               - For `unit-tests`: Run `pnpm test:unit` to see failing tests
               - For `build`: Run `pnpm build` to see build errors
               - For `db-check`: Run `pnpm db:check` to see schema issues
               - For `check-conflicts`: Check for merge conflicts with the base branch

            2. **Fix the issues**:
               - Fix linting errors and type errors
               - Fix failing tests or update tests if behavior changed intentionally
               - Fix build errors
               - Resolve any conflicts

            3. **Verify your fixes**:
               - Run `pnpm lint` - must pass
               - Run `pnpm type-check` - must pass
               - Run `pnpm test:unit` - must pass
               - Run `pnpm build` - must succeed

            ## Constraints
            - Only fix issues directly related to the failing checks
            - Do not refactor unrelated code
            - All checks must pass before committing
            - Create clear commit messages explaining what was fixed