name: CI Auto-Fix

# Jules automatically fixes CI failures
# Uses author-based invocation strategy:
# - Jules PRs: @jules mention (free)
# - Renovate PRs: API once + jules-invoked label, then @jules
# - Human PRs: API invoke

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to fix (optional)'
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  fix-failures:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 1

      - name: Get PR context
        id: pr
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_PR: ${{ github.event.inputs.pr_number }}
        run: |
          if [[ -n "$INPUT_PR" ]]; then
            echo "Manually triggered for PR #$INPUT_PR"
            PR_DATA=$(gh pr view "$INPUT_PR" --json number,headRefName,labels,author --repo "${{ github.repository }}" --jq '{number, headRefName, labels: [.labels[].name], author: .author.login}')
          else
            PR_DATA=$(gh api "/repos/${{ github.repository }}/pulls" \
              --jq ".[] | select(.head.sha == \"$SHA\") | {number, headRefName, labels: [.labels[].name], author: .user.login}" --repo "${{ github.repository }}" | head -1)
          fi

          if [[ -z "$PR_DATA" || "$PR_DATA" == "null" ]]; then
            echo "has_pr=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          PR_NUM=$(echo "$PR_DATA" | jq -r '.number')
          BRANCH=$(echo "$PR_DATA" | jq -r '.headRefName')
          LABELS=$(echo "$PR_DATA" | jq -r '.labels | join(",")')
          AUTHOR=$(echo "$PR_DATA" | jq -r '.author')

          # Skip if skip-ci label
          if [[ "$LABELS" == *"skip-ci"* ]]; then
            echo "has_pr=false" >> $GITHUB_OUTPUT
            echo "⏭️ skip-ci label found, not fixing"
            exit 0
          fi

          echo "has_pr=true" >> $GITHUB_OUTPUT
          echo "number=$PR_NUM" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "labels=$LABELS" >> $GITHUB_OUTPUT
          echo "author=$AUTHOR" >> $GITHUB_OUTPUT

      - name: Check commit author for loop prevention
        if: steps.pr.outputs.has_pr == 'true'
        id: loop_check
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          COMMIT_AUTHOR=$(gh api "/repos/${{ github.repository }}/commits/$SHA" --jq '.commit.author.name')
          echo "Commit author: $COMMIT_AUTHOR"
          
          if [[ "$COMMIT_AUTHOR" == "google-labs-jules" || "$COMMIT_AUTHOR" == "Jules" ]]; then
            echo "is_loop=true" >> $GITHUB_OUTPUT
            echo "🛑 Loop detected: Last commit was by Jules."
          else
            echo "is_loop=false" >> $GITHUB_OUTPUT
          fi

      - name: Notify Loop Detected
        if: steps.loop_check.outputs.is_loop == 'true'
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          gh pr comment "$PR" --body "🚨 **Manual Intervention Required**
    
          Jules attempted a fix but CI is still failing. To prevent an infinite loop, I'm stopping here.
          Please review the logs manually." --repo "${{ github.repository }}"
          
          # Fail the workflow to mark as needing attention (optional, but good for visibility)
          exit 1

      - name: Determine invocation method
        if: steps.pr.outputs.has_pr == 'true' && steps.loop_check.outputs.is_loop != 'true'
        id: method
        env:
          AUTHOR: ${{ steps.pr.outputs.author }}
          LABELS: ${{ steps.pr.outputs.labels }}
        run: bash .github/scripts/determine-agent-action.sh

      - name: Check if already fixing
        if: steps.pr.outputs.has_pr == 'true' && steps.loop_check.outputs.is_loop != 'true'
        id: check
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          RECENT=$(gh api "/repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | contains("fixing")) and (.created_at | fromdateiso8601) > (now - 1800))] | length' --repo "${{ github.repository }}" 2>/dev/null || echo "0")

          echo "already_fixing=$([[ "$RECENT" -gt 0 ]] && echo "true" || echo "false")" >> $GITHUB_OUTPUT

      - name: Collect failure context
        if: steps.pr.outputs.has_pr == 'true' && steps.check.outputs.already_fixing != 'true' && steps.loop_check.outputs.is_loop != 'true'
        id: failures
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT }}
          GITHUB_RUN_ID: ${{ github.event.workflow_run.id }}
        run: bash .github/scripts/analyze-failures.sh

      - name: Checkout PR branch
        if: steps.pr.outputs.has_pr == 'true' && steps.check.outputs.already_fixing != 'true' && steps.loop_check.outputs.is_loop != 'true'
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0

      - name: Post CI failure notification
        if: steps.pr.outputs.has_pr == 'true' && steps.check.outputs.already_fixing != 'true' && steps.loop_check.outputs.is_loop != 'true'
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          FAILED: ${{ steps.failures.outputs.failed_jobs }}
          URL: ${{ steps.failures.outputs.run_url }}
          METHOD: ${{ steps.method.outputs.method }}
          REASON: ${{ steps.method.outputs.reason }}
          AUTHOR: ${{ steps.pr.outputs.author }}
        run: |
          gh pr comment "$PR_NUMBER" --body "🚨 **CI Failed**
          
          **Failed Jobs:** $FAILED
          **Run URL:** $URL
          
          ---
          
          **Author:** \`$AUTHOR\`
          **Fix Method:** $(if [[ \"$METHOD\" == \"api\" ]]; then echo \"Jules API (new session)\"; else echo \"@jules mention (cost-optimized)\"; fi)
          **Reason:** $REASON" --repo "${{ github.repository }}"
          
          gh pr edit "$PR_NUMBER" --add-label "ci-failing" --repo "${{ github.repository }}" 2>/dev/null || true

      # API Invoke path: For human PRs and first-time Renovate
      - name: Prepare Prompt
        if: |
          steps.pr.outputs.has_pr == 'true' && 
          steps.check.outputs.already_fixing != 'true' && 
          steps.method.outputs.method == 'api' &&
          steps.loop_check.outputs.is_loop != 'true'
        id: prompt
        run: |
           # Read prompt file
           PROMPT=$(cat .github/prompts/ci-failure.md)
           
           # Interpolate variables
           PROMPT="${PROMPT//\$PR_NUMBER/${{ steps.pr.outputs.number }}}"
           PROMPT="${PROMPT//\$FAILED_JOBS/${{ steps.failures.outputs.failed_jobs }}}"
           
           # Output handling for multiline string
           EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
           echo "prompt<<$EOF" >> "$GITHUB_OUTPUT"
           echo "$PROMPT" >> "$GITHUB_OUTPUT"
           echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Invoke Jules API
        if: |
          steps.pr.outputs.has_pr == 'true' && 
          steps.check.outputs.already_fixing != 'true' && 
          steps.method.outputs.method == 'api' &&
          steps.loop_check.outputs.is_loop != 'true'
        uses: google-labs-code/jules-action@bff7875eaa123cac6742b7cfc51005b95ba4d566 # v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: ${{ steps.pr.outputs.branch }}
          prompt: ${{ steps.prompt.outputs.prompt }}

      - name: Add jules-invoked label (Enable Fallback)
        if: |
          steps.pr.outputs.has_pr == 'true' && 
          steps.check.outputs.already_fixing != 'true' && 
          steps.method.outputs.method == 'api' &&
          steps.loop_check.outputs.is_loop != 'true'
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr edit "$PR_NUMBER" --add-label "jules-invoked" --repo "${{ github.repository }}" 2>/dev/null || true
          gh pr comment "$PR_NUMBER" --body "📝 Added \`jules-invoked\` label. Future CI failures will use @jules mentions (cost-optimized)." --repo "${{ github.repository }}"

      # Mention path: For Jules PRs and subsequent Renovate failures
      - name: Post @jules mention for CI fix
        if: |
          steps.pr.outputs.has_pr == 'true' && 
          steps.check.outputs.already_fixing != 'true' && 
          steps.method.outputs.method == 'mention' &&
          steps.loop_check.outputs.is_loop != 'true'
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          FAILED: ${{ steps.failures.outputs.failed_jobs }}
          URL: ${{ steps.failures.outputs.run_url }}
        run: |
          echo "@jules CI failed. Please fix the following:" > /tmp/comment.md
          echo "" >> /tmp/comment.md
          echo "Failed Jobs: $FAILED" >> /tmp/comment.md
          echo "" >> /tmp/comment.md
          echo "Instructions:" >> /tmp/comment.md
          echo "1. Run \`pnpm lint && pnpm type-check && pnpm test:unit && pnpm build\` to reproduce" >> /tmp/comment.md
          echo "2. Fix all issues" >> /tmp/comment.md
          echo "3. Commit with message: \`fix: resolve CI failures\`" >> /tmp/comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md --repo "${{ github.repository }}"

      - name: Log if no PR found
        if: steps.pr.outputs.has_pr != 'true'
        run: echo "No PR found for this run"
