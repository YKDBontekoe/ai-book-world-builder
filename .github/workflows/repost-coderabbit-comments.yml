name: Repost CodeRabbit Comments

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  repost-comment:
    if: github.actor == 'coderabbitai[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Repost Comment
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # Determine context (PR or Issue)
          if [ -n "${{ github.event.issue.number }}" ]; then
            ISSUE_NUMBER="${{ github.event.issue.number }}"
          elif [ -n "${{ github.event.pull_request.number }}" ]; then
            ISSUE_NUMBER="${{ github.event.pull_request.number }}"
          else
            echo "Could not determine issue/PR number"
            exit 1
          fi

          echo "Reposting comment from CodeRabbit on Issue/PR #$ISSUE_NUMBER"
          gh issue comment "$ISSUE_NUMBER" --body "$COMMENT_BODY"
