name: Security Audit & Auto-Fix

on:
  schedule:
    # Run every night at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      auto_fix:
        description: 'Automatically fix vulnerabilities'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    outputs:
      has_vulnerabilities: ${{ steps.audit.outputs.has_vulnerabilities }}
      vulnerability_count: ${{ steps.audit.outputs.vulnerability_count }}
      audit_output: ${{ steps.audit.outputs.audit_output }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Run security audit
        id: audit
        continue-on-error: true
        run: |
          # Capture audit output
          AUDIT_OUTPUT=$(pnpm audit --json 2>&1 || true)
          
          # Count vulnerabilities
          HIGH_COUNT=$(echo "$AUDIT_OUTPUT" | jq '.metadata.vulnerabilities.high // 0')
          CRITICAL_COUNT=$(echo "$AUDIT_OUTPUT" | jq '.metadata.vulnerabilities.critical // 0')
          MODERATE_COUNT=$(echo "$AUDIT_OUTPUT" | jq '.metadata.vulnerabilities.moderate // 0')
          TOTAL=$((HIGH_COUNT + CRITICAL_COUNT + MODERATE_COUNT))
          
          echo "vulnerability_count=$TOTAL" >> $GITHUB_OUTPUT
          echo "high_count=$HIGH_COUNT" >> $GITHUB_OUTPUT
          echo "critical_count=$CRITICAL_COUNT" >> $GITHUB_OUTPUT
          
          if [ "$TOTAL" -gt 0 ]; then
            echo "has_vulnerabilities=true" >> $GITHUB_OUTPUT
            echo "🚨 Found $TOTAL vulnerabilities (Critical: $CRITICAL_COUNT, High: $HIGH_COUNT, Moderate: $MODERATE_COUNT)"
          else
            echo "has_vulnerabilities=false" >> $GITHUB_OUTPUT
            echo "✅ No vulnerabilities found"
          fi
          
          # Save readable output
          pnpm audit --audit-level=moderate > /tmp/audit-readable.txt 2>&1 || true
          echo "audit_file=/tmp/audit-readable.txt" >> $GITHUB_OUTPUT

      - name: Upload audit results
        if: steps.audit.outputs.has_vulnerabilities == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: security-audit
          path: /tmp/audit-readable.txt

  auto-fix:
    runs-on: ubuntu-latest
    needs: [audit]
    if: |
      needs.audit.outputs.has_vulnerabilities == 'true' &&
      (github.event_name == 'schedule' || github.event.inputs.auto_fix == 'true')
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Attempt automatic fix
        id: fix
        run: |
          # Try pnpm audit fix
          pnpm audit --fix || true
          
          # Check if lockfile changed
          if git diff --quiet pnpm-lock.yaml; then
            echo "fixed=false" >> $GITHUB_OUTPUT
            echo "No automatic fixes available"
          else
            echo "fixed=true" >> $GITHUB_OUTPUT
            echo "Automatic fixes applied"
          fi

      - name: Create PR with fixes
        if: steps.fix.outputs.fixed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT }}
        run: |
          BRANCH="security/auto-fix-$(date +%Y%m%d)"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout -b "$BRANCH"
          git add pnpm-lock.yaml package.json
          git commit -m "security: fix vulnerabilities found by audit"
          git push origin "$BRANCH"
          
          gh pr create \
            --title "🔒 Security: Fix ${{ needs.audit.outputs.vulnerability_count }} vulnerabilities" \
            --body "## Security Fixes
          
          This PR automatically fixes vulnerabilities found by the nightly security audit.
          
          **Vulnerabilities fixed:** ${{ needs.audit.outputs.vulnerability_count }}
          
          ### What changed
          - Updated vulnerable dependencies to patched versions
          
          ### Labels
          This PR is marked for auto-merge after CI passes.
          
          ---
          🤖 Generated by Security Audit workflow" \
            --label "security,dependencies,auto-merge-candidate" \
            --head "$BRANCH"

  jules-fix-remaining:
    runs-on: ubuntu-latest
    needs: [audit, auto-fix]
    if: |
      always() &&
      needs.audit.outputs.has_vulnerabilities == 'true' &&
      (needs.auto-fix.result == 'skipped' || needs.auto-fix.result == 'failure')
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0

      - name: Download audit results
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: security-audit
          path: /tmp

      - name: Invoke Jules for complex fixes
        uses: google-labs-code/jules-action@bff7875eaa123cac6742b7cfc51005b95ba4d566 # v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            The nightly security audit found vulnerabilities that couldn't be automatically fixed.

            ## Audit Results
            $(cat /tmp/audit-readable.txt)

            ## Your Task
            1. Analyze the vulnerabilities
            2. For each vulnerability:
               - Determine if it can be fixed by updating dependencies
               - Check if updates would cause breaking changes
               - If safe, update the dependency
               - If risky, add a comment explaining the issue
            3. After fixes:
               - Run `pnpm install`
               - Run `pnpm build` to verify nothing broke
               - Run `pnpm test:unit`
            4. Create a clear commit message

            ## Constraints
            - Prioritize critical and high severity issues
            - Don't introduce breaking changes
            - If a fix requires code changes (not just deps), make minimal changes
            - Create a PR with your fixes

  notify-critical:
    runs-on: ubuntu-latest
    needs: [audit]
    if: needs.audit.outputs.vulnerability_count > 0
    steps:
      - name: Create issue for critical vulnerabilities
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT }}
        run: |
          # Check for existing open security issue
          EXISTING=$(gh issue list --label "security" --state open --json number --jq '.[0].number' || echo "")
          
          if [ -n "$EXISTING" ]; then
            echo "Security issue already exists: #$EXISTING"
            gh issue comment "$EXISTING" --body "🔄 **Security Audit Update**
            
            New scan completed. Found **${{ needs.audit.outputs.vulnerability_count }}** vulnerabilities.
            
            Automatic fixes are being attempted."
          else
            gh issue create \
              --title "🚨 Security: ${{ needs.audit.outputs.vulnerability_count }} vulnerabilities detected" \
              --body "## Security Audit Alert
            
            The nightly security audit has detected vulnerabilities in dependencies.
            
            **Vulnerabilities:** ${{ needs.audit.outputs.vulnerability_count }}
            
            ### Next Steps
            1. Check if auto-fix PR was created
            2. Review and merge the fix
            3. If no auto-fix, manual intervention required
            
            ---
            🤖 Generated by Security Audit workflow" \
              --label "security,priority/high"
