name: Report CodeRabbit Comments

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  report-comment:
    if: github.actor == 'coderabbitai[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Report Comment
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          echo "Reporting CodeRabbit Comment:"
          echo "URL: $COMMENT_URL"
          echo "Body: $COMMENT_BODY"
