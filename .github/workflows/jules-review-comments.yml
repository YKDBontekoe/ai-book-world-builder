name: Jules Reviews CodeRabbit Feedback

on:
  # Trigger on CodeRabbit's summary/walkthrough comment (indicates review is complete)
  issue_comment:
    types: [created]
  # Also trigger on PR review submission (CodeRabbit submits a review when done)
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # This job only runs when CodeRabbit posts its SUMMARY comment (review complete)
  jules-review-on-summary:
    runs-on: ubuntu-latest
    # Only trigger when CodeRabbit posts a comment containing "Walkthrough" or "Summary"
    # This indicates the review is complete (not just individual inline comments)
    if: |
      github.actor == 'coderabbitai[bot]' && 
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (
        contains(github.event.comment.body, '## Walkthrough') ||
        contains(github.event.comment.body, '## Summary') ||
        contains(github.event.comment.body, '<!-- coderabbit-summary -->')
      )
    steps:
      - name: Log trigger reason
        run: |
          echo "✅ CodeRabbit summary comment detected - review is complete!"
          echo "📋 Comment URL: ${{ github.event.comment.html_url }}"

      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0

      - name: Collect all CodeRabbit feedback
        id: collect
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "📥 Fetching all CodeRabbit comments from PR #$PR_NUMBER..."
          
          # Fetch inline review comments from CodeRabbit
          REVIEW_COMMENTS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$REPO/pulls/$PR_NUMBER/comments" \
            --jq '[.[] | select(.user.login == "coderabbitai[bot]") | {type: "inline", path: .path, line: (.line // .original_line // "N/A"), body: .body, url: .html_url}]' 2>/dev/null || echo "[]")
          
          # Fetch PR issue comments (walkthrough, summary) from CodeRabbit
          ISSUE_COMMENTS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select(.user.login == "coderabbitai[bot]") | {type: "general", path: "N/A", line: "N/A", body: .body, url: .html_url}]' 2>/dev/null || echo "[]")
          
          # Fetch PR reviews from CodeRabbit
          REVIEWS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$REPO/pulls/$PR_NUMBER/reviews" \
            --jq '[.[] | select(.user.login == "coderabbitai[bot]" and .body != null and .body != "") | {type: "review", path: "N/A", line: "N/A", body: .body, url: .html_url}]' 2>/dev/null || echo "[]")
          
          # Merge all comments (handle potential empty arrays)
          ALL_COMMENTS=$(jq -s 'add | unique_by(.url) // []' <<< "$REVIEW_COMMENTS $ISSUE_COMMENTS $REVIEWS")
          
          # Save to file
          echo "$ALL_COMMENTS" > /tmp/all-coderabbit-feedback.json
          
          # Count and categorize
          INLINE_COUNT=$(echo "$ALL_COMMENTS" | jq '[.[] | select(.type == "inline")] | length')
          GENERAL_COUNT=$(echo "$ALL_COMMENTS" | jq '[.[] | select(.type == "general")] | length')
          REVIEW_COUNT=$(echo "$ALL_COMMENTS" | jq '[.[] | select(.type == "review")] | length')
          TOTAL_COUNT=$(echo "$ALL_COMMENTS" | jq '. | length')
          
          echo "📊 Found:"
          echo "  - $INLINE_COUNT inline code comments"
          echo "  - $GENERAL_COUNT general PR comments (includes walkthrough)"  
          echo "  - $REVIEW_COUNT review summaries"
          echo "  - $TOTAL_COUNT total items"
          
          echo "total_count=$TOTAL_COUNT" >> $GITHUB_OUTPUT
          echo "inline_count=$INLINE_COUNT" >> $GITHUB_OUTPUT
          
          # Only include inline comments in the prompt (actionable items)
          # The walkthrough/summary is informational, inline comments need action
          ACTIONABLE=$(echo "$ALL_COMMENTS" | jq '[.[] | select(.type == "inline")]')
          ACTIONABLE_COUNT=$(echo "$ACTIONABLE" | jq '. | length')
          echo "actionable_count=$ACTIONABLE_COUNT" >> $GITHUB_OUTPUT
          
          # Create formatted summary for Jules (only actionable items)
          if [ "$ACTIONABLE_COUNT" -gt 0 ]; then
            FORMATTED=$(echo "$ACTIONABLE" | jq -r '
              .[] | 
              "---\n" +
              "**File:** \(.path) (Line \(.line))\n" +
              "**Link:** \(.url)\n\n" +
              "\(.body)\n"
            ')
            echo "$FORMATTED" > /tmp/actionable-feedback.txt
          else
            echo "No actionable inline comments found." > /tmp/actionable-feedback.txt
          fi
          
          echo "✅ All CodeRabbit feedback collected!"

      - name: Invoke Jules to address actionable feedback
        if: steps.collect.outputs.actionable_count > 0
        uses: google-labs-code/jules-invoke@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: ${{ github.head_ref || github.ref_name }}
          prompt: |
            You are reviewing Pull Request #${{ github.event.issue.number }} in ${{ github.repository }}.
            
            CodeRabbit has completed its AI code review and left actionable inline comments.

            ## Actionable Feedback (${{ steps.collect.outputs.actionable_count }} items)
            The following inline code comments require your attention:

            $(cat /tmp/actionable-feedback.txt)

            ## Your Task
            1. **Read each inline comment carefully** - These are specific code improvement suggestions
            2. **Prioritize by severity:**
               - 🔴 Security issues → Fix immediately
               - 🟠 Bugs/Logic errors → Fix
               - 🟡 Performance issues → Fix if straightforward
               - 🟢 Style/Best practices → Fix if low effort
            3. **For each valid concern:**
               - Navigate to the file and line mentioned
               - Implement the suggested fix
               - If the suggestion is unclear, make your best judgment
            4. **Verify your changes:**
               - Run `pnpm install` if needed
               - Run `pnpm build` to verify compilation
               - Run `pnpm test:unit` to verify tests pass
            5. **Skip suggestions that:**
               - Are already addressed in the code
               - Would require major refactoring
               - Conflict with project conventions

            ## Constraints
            - Only modify files mentioned in the feedback
            - Keep changes focused and minimal
            - All tests must pass before committing
            - Create a single commit with all fixes
            - Use a clear commit message: "fix: address CodeRabbit review feedback"

      - name: Comment if no actionable items
        if: steps.collect.outputs.actionable_count == 0
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          echo "ℹ️ CodeRabbit review complete but no actionable inline comments found."
          echo "The walkthrough/summary was informational only."

  # Alternative: Trigger on PR review submission (backup approach)
  jules-review-on-pr-review:
    runs-on: ubuntu-latest
    if: |
      github.actor == 'coderabbitai[bot]' && 
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'commented'
    steps:
      - name: Check if this is the final review
        id: check
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Check if CodeRabbit has posted a summary comment
          # This indicates the review is complete
          SUMMARY_EXISTS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select(.user.login == "coderabbitai[bot]" and (contains(.body; "## Walkthrough") or contains(.body; "## Summary")))] | length' 2>/dev/null || echo "0")
          
          if [ "$SUMMARY_EXISTS" -gt 0 ]; then
            echo "has_summary=true" >> $GITHUB_OUTPUT
            echo "✅ CodeRabbit summary found - review is complete"
          else
            echo "has_summary=false" >> $GITHUB_OUTPUT
            echo "⏳ No summary yet - review may still be in progress"
          fi

      - name: Skip if review not complete
        if: steps.check.outputs.has_summary != 'true'
        run: |
          echo "⏳ Waiting for CodeRabbit to post its summary..."
          echo "This workflow will re-trigger when the summary is posted."
          exit 0

      # Rest of the review handling would go here (similar to above)
      # But the issue_comment trigger is more reliable for this
