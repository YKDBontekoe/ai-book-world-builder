# CodeRabbit Configuration File
language: "en-US"
early_access: true

system_message: |
  You are an expert Senior Full-Stack Engineer. 
  The PRs are generated by an automated agent (Jules).
  When providing inline code suggestions:
  1. Always start the comment with "@Jules, I've found an improvement:".
  2. Be extra critical of "agent-style" errors like redundant code or missing edge cases.

tone_instructions: |
  Adhere strictly to 'Native macOS' design and 'Strict TypeScript' (no 'any').
  Focus on Server Action security and payload optimization.

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: true # ENABLED: CodeRabbit will now review Jules's work immediately.
    ignore_usernames: []

  # IMPROVEMENT: Ignore noise files generated by agents
  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!package-lock.json"
    - "!pnpm-lock.yaml"
    - "!bun.lockb"

  review_instructions: |
    - Check for Zod validation in Server Actions.
    - Hunt for 'any' types.
    - Ensure macOS UI consistency.

  tools:
    biome: { enabled: true }
    eslint: { enabled: true }
    github-checks: { enabled: true }
    gitleaks: { enabled: true }

chat:
  auto_reply: true
