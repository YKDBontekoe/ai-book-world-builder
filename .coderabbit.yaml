# CodeRabbit Configuration File
# Documentation: https://docs.coderabbit.ai/reference/configuration
# Validate here: https://docs.coderabbit.ai/configuration/yaml-validator

# =============================================================================
# GENERAL SETTINGS
# =============================================================================
language: "en-US"
early_access: true

# Custom tone for reviews - professional but friendly
tone_instructions: |
  Be concise and actionable. Focus on issues that matter.
  Use code suggestions when possible instead of just describing issues.
  Prioritize security and performance issues over style.

# =============================================================================
# REVIEWS CONFIGURATION
# =============================================================================
reviews:
  # Assertive mode for thorough reviews
  profile: "assertive"
  
  # Don't auto-request changes (let Jules handle fixes)
  request_changes_workflow: false
  
  # Generate a high-level summary for quick understanding
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  
  # Custom summary instructions
  high_level_summary_instructions: |
    Provide a brief summary suitable for a changelog entry.
    Highlight any breaking changes, security implications, or performance impacts.
    List the main files modified and their purposes.
  
  # Commit status integration
  review_status: true
  commit_status: true
  fail_commit_status: false  # Don't fail status, let CI handle that
  
  # Walkthrough settings
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  
  # Effort estimation helps prioritize reviews
  estimate_code_review_effort: true
  
  # Link analysis
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  
  # =============================================================================
  # AUTO-LABELING - Critical for dynamic agentic workflows
  # =============================================================================
  suggested_labels: true
  auto_apply_labels: true
  
  labeling_instructions:
    # Type labels
    - label: "bug"
      instructions: "Apply when the PR fixes a bug, defect, or error"
    - label: "enhancement"
      instructions: "Apply when the PR adds new features or improvements"
    - label: "refactor"
      instructions: "Apply when the PR refactors code without changing behavior"
    - label: "docs"
      instructions: "Apply when the PR only changes documentation files (.md)"
    - label: "chore"
      instructions: "Apply for maintenance tasks, config changes, tooling updates"
    - label: "test"
      instructions: "Apply when the PR adds or modifies tests"
    
    # Risk/Priority labels
    - label: "security"
      instructions: "Apply when the PR addresses security issues or vulnerabilities"
    - label: "breaking-change"
      instructions: "Apply when the PR contains API changes, removed features, or incompatible updates"
    - label: "performance"
      instructions: "Apply when the PR improves performance, reduces bundle size, or optimizes queries"
    - label: "critical"
      instructions: "Apply for urgent fixes that should be reviewed immediately"
    
    # Scope labels
    - label: "frontend"
      instructions: "Apply when changes are in src/components, src/app pages, or styling"
    - label: "backend"
      instructions: "Apply when changes are in src/app/api, src/app/actions, or src/db"
    - label: "ci"
      instructions: "Apply when changes are in .github/workflows or CI configuration"
    - label: "deps"
      instructions: "Apply for dependency updates (package.json, lockfiles)"
    
    # Quality labels  
    - label: "needs-tests"
      instructions: "Apply when new code lacks adequate test coverage"
    - label: "needs-docs"
      instructions: "Apply when new features lack documentation"
    - label: "needs-review"
      instructions: "Apply for complex changes that need careful human review"
    
    # Size labels (auto-applied based on diff size)
    - label: "size/xs"
      instructions: "Apply for trivial changes (< 10 lines)"
    - label: "size/s"
      instructions: "Apply for small changes (10-50 lines)"
    - label: "size/m"
      instructions: "Apply for medium changes (50-200 lines)"
    - label: "size/l"
      instructions: "Apply for large changes (200-500 lines)"
    - label: "size/xl"
      instructions: "Apply for extra large changes (> 500 lines)"
    
    # Automation labels
    - label: "auto-merge-candidate"
      instructions: "Apply for low-risk, well-tested changes: deps updates, typo fixes, docs-only, small refactors with tests"
    - label: "jules-review"
      instructions: "Apply when Jules should prioritize reviewing this PR"
    - label: "skip-ci"
      instructions: "Apply for changes that don't need CI (docs only, comments only)"
  
  # Reviewer suggestions
  suggested_reviewers: true
  auto_assign_reviewers: false
  
  # Disable fortune/poem for cleaner output
  in_progress_fortune: false
  poem: false
  
  # Enable AI agent prompt integration (for Jules)
  enable_prompt_for_ai_agents: true
  
  # =============================================================================
  # REVIEW INSTRUCTIONS FOR AI AGENTS
  # =============================================================================
  review_instructions: |
    You are a Senior Full-Stack Engineer specialized in Next.js, TypeScript, and React.
    
    ## CRITICAL: AI Agent Integration (Jules Automation)
    When leaving actionable comments:
    1. Start inline code comments with `@jules` for automatic handling
    2. Be specific: include exact file paths and line numbers
    3. Provide complete code suggestions when possible (use diff format)
    4. Categorize severity: 🔴 Critical, 🟠 Bug, 🟡 Performance, 🟢 Style
    5. Example format:
       ```
       @jules 🟠 Bug: This could cause a null reference error
       
       **File:** src/utils/helper.ts:42
       **Issue:** Missing null check before accessing property
       **Suggested fix:**
       ```diff
       - const value = data.property;
       + const value = data?.property;
       ```
       
    ## PR Author Detection
    - For `google-labs-jules` or `*[bot]` authors: Use @jules prefix
    - For human authors: Write for human readability first
    
    ## Technical Standards
    - Strict TypeScript: Zero tolerance for 'any' types
    - Server Actions: Verify Zod validation and auth checks
    - React: Check for proper error boundaries and suspense
    - Database: Verify Drizzle queries are optimized
    - Security: Check for XSS, CSRF, injection vulnerabilities
    
    ## Review Focus (Priority Order)
    1. 🔴 **Security Issues** - ALWAYS flag, include CVE if known
    2. 🟠 **Logic Bugs** - Clear explanation with fix suggestion
    3. 🟡 **Performance** - Database queries, re-renders, bundle size
    4. 🔵 **Type Safety** - Proper TypeScript usage
    5. ⚪ **Error Handling** - Graceful failures
    
    ## Don't Flag
    - Minor style preferences already covered by Biome
    - Import ordering (handled by tooling)
    - Comment formatting
  
  # =============================================================================
  # AUTO-REVIEW SETTINGS
  # =============================================================================
  # NOTE: CodeRabbit automatically skips bot users (including google-labs-jules).
  # To enable reviews for bot PRs, we use a GitHub Action workflow that posts
  # "@coderabbitai review" comment when a bot creates a PR.
  # See: .github/workflows/agentic-orchestrator.yml (trigger-coderabbit job)
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: true  # Review draft PRs (important for Jules)
    
    # Ignore certain PRs by title
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "SKIP REVIEW"
    
    # Do not ignore any usernames - bot reviews are triggered via @coderabbitai command
    ignore_usernames: []
    
    # Only auto-review PRs targeting these branches
    base_branches:
      - main
      - develop
  
  # =============================================================================
  # PATH FILTERS - What to review/ignore
  # =============================================================================
  path_filters:
    # Ignore lock files and generated content
    - "!**/node_modules/**"
    - "!package-lock.json"
    - "!pnpm-lock.yaml"
    - "!bun.lockb"
    - "!**/*.lock"
    
    # Ignore build outputs
    - "!.next/**"
    - "!storybook-static/**"
    - "!playwright-report/**"
    - "!test-results/**"
    - "!coverage/**"
    
    # Ignore auto-generated files
    - "!**/generated/**"
    - "!**/*.generated.ts"
    - "!drizzle/meta/**"
  
  # =============================================================================
  # PATH-SPECIFIC INSTRUCTIONS
  # =============================================================================
  path_instructions:
    - path: "src/app/actions/**"
      instructions: |
        CRITICAL: Server Actions require extra scrutiny:
        - Verify authentication checks at the start
        - Validate all inputs with Zod schemas
        - Check for authorization (user owns resource)
        - Ensure proper error handling
        - Verify rate limiting where appropriate
    
    - path: "src/app/api/**"
      instructions: |
        API Routes need security review:
        - Check authentication middleware
        - Validate request bodies
        - Ensure proper HTTP status codes
        - Check for proper error responses
    
    - path: "src/components/**"
      instructions: |
        React Components review:
        - Check for proper TypeScript props
        - Verify accessibility (aria labels, keyboard nav)
        - Check for memory leaks (useEffect cleanup)
        - Ensure proper loading/error states
    
    - path: "src/db/**"
      instructions: |
        Database layer review:
        - Check Drizzle queries for N+1 problems
        - Verify proper indexes exist for queries
        - Check for SQL injection vulnerabilities
        - Ensure transactions where needed
    
    - path: "tests/**"
      instructions: |
        Test file review:
        - Check test coverage is meaningful
        - Verify edge cases are tested
        - Ensure mocks are appropriate
        - Check for flaky test patterns
    
    - path: ".github/workflows/**"
      instructions: |
        GitHub Actions review:
        - Check for hardcoded secrets
        - Verify proper permissions
        - Check for injection vulnerabilities
        - Ensure proper caching
  
  # =============================================================================
  # PRE-MERGE CHECKS
  # =============================================================================
  pre_merge_checks:
    docstrings:
      mode: "warning"  # Warn about missing docstrings
      threshold: 80
    
    title:
      mode: "warning"
      requirements: |
        PR title should follow conventional commits:
        - feat: for features
        - fix: for bug fixes
        - docs: for documentation
        - chore: for maintenance
        - refactor: for refactoring
        - perf: for performance
        - test: for tests
    
    description:
      mode: "warning"  # Warn if description is empty
    
    issue_assessment:
      mode: "warning"  # Check if linked issues are resolved
  
  # =============================================================================
  # FINISHING TOUCHES
  # =============================================================================
  finishing_touches:
    docstrings:
      enabled: true  # Can generate docstrings
    unit_tests:
      enabled: true  # Can suggest unit tests
  
  # =============================================================================
  # TOOLS INTEGRATION
  # =============================================================================
  tools:
    # Biome for formatting/linting
    biome:
      enabled: true
    
    # GitHub checks integration
    github-checks:
      enabled: true
      timeout_ms: 120000  # 2 minute timeout
    
    # Secret detection
    gitleaks:
      enabled: true
    
    # Shell script linting
    shellcheck:
      enabled: true
    
    # Markdown linting
    markdownlint:
      enabled: true
    
    # Dockerfile linting
    hadolint:
      enabled: true
    
    # AST-based rules
    ast-grep:
      essential_rules: true
      packages: []

# =============================================================================
# CHAT CONFIGURATION
# =============================================================================
chat:
  auto_reply: true  # Respond to @coderabbitai mentions

# =============================================================================
# KNOWLEDGE BASE
# =============================================================================
knowledge_base:
  learnings:
    scope: auto  # Learn from this repo
  issues:
    scope: auto  # Reference issues
  jira:
    project_keys: []
  linear:
    team_keys: []
  pull_requests:
    scope: auto  # Reference PRs

# =============================================================================
# CODE GENERATION
# =============================================================================
code_generation:
  docstrings:
    # Use JSDoc for TypeScript
    language_config:
      typescript:
        style: jsdoc
        include_types: false  # Types are in TS already
      javascript:
        style: jsdoc
