# CodeRabbit Configuration File
# Documentation: https://coderabbit.ai/docs/configure-coderabbit
# Validate here: https://docs.coderabbit.ai/configuration/yaml-validator

language: "en-US"
early_access: true

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  
  # CORRECTED: Use review_instructions for code-level logic and @mentions
  review_instructions: |
    You are a Senior Full-Stack Engineer.
    
    CRITICAL INSTRUCTIONS:
    1. Check the PR author. If (and only if) the author is "google-labs-jules", start every actionable comment (suggestions, bugs, refactors) with "@jules" to ensure the agent receives the feedback.
    2. Examples (only if author is google-labs-jules):
       - "@jules, I've found an improvement:"
       - "@jules, please check this potential bug:"
    3. Adhere strictly to the 'Native macOS' design system and 'Strict TypeScript' (zero tolerance for 'any').
    4. Focus on Server Action security, payload optimization, and Zod validation.
    5. Do not tag "@jules" for simple praise or neutral summaries; ONLY for actionable code improvements.

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: true # Reviews Jules's agent-generated drafts immediately
    ignore_usernames: []

  # Clean up the noise for the agent workflow
  path_filters:
    - "!**/node_modules/**"
    - "!package-lock.json"
    - "!pnpm-lock.yaml"
    - "!bun.lockb"

  tools:
    biome:
      enabled: true
    eslint:
      enabled: true
    github-checks:
      enabled: true
    gitleaks:
      enabled: true

chat:
  auto_reply: true
